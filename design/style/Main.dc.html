<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;font-family:'Avenir Next','Segoe UI',system-ui,sans-serif}
    .pf{--ink:#1b2226;--dim:#6a7a83;--ox:#9c3a1c;--go:#2f7d52}
    .pf .lbl{position:absolute;text-align:right}
    .pf .lbl b{display:block;font-size:13.5px;font-weight:600;color:#1b2226;letter-spacing:.1px}
    .pf .lbl .s{font-size:8px;letter-spacing:1.8px;margin-top:1px}
    .pf .lbl .n{margin-top:3px;font-size:12px;font-weight:700;color:#1b2226}
    .pf .lbl .n i{font-style:normal;color:#6a7a83;font-weight:500;font-size:9px;letter-spacing:1px}
    .pf .card{background:#f4efe4;border-radius:5px;padding:9px 8px;box-sizing:border-box;position:relative;
      box-shadow:0 10px 22px -12px rgba(12,20,24,.85)}
  </style>
</helmet>

<div class="pf" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#cfdce1">

  <svg viewBox="0 0 390 844" style="position:absolute;inset:0;width:390px;height:844px" aria-hidden="true">
    <defs>
      <linearGradient id="k-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e6eef1"/><stop offset="58%" stop-color="#c8d8de"/><stop offset="100%" stop-color="#a9bfc7"/>
      </linearGradient>
      <linearGradient id="k-wall" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#232a2e"/><stop offset="100%" stop-color="#3d464b"/>
      </linearGradient>
    </defs>
    <rect width="390" height="844" fill="url(#k-sky)"/>
    <!-- the valley, far below: this is a side view, so exposure is the whole left half -->
    <g opacity=".38" fill="#8ea4ad">
      <path d="M0 706 L44 664 L92 700 L132 656 L182 704 L206 682 L206 844 L0 844 Z"/>
    </g>
    <g opacity=".22" fill="#7b939d">
      <path d="M0 762 L58 726 L120 768 L170 740 L206 772 L206 844 L0 844 Z"/>
    </g>
    <!-- the wall, seen edge-on -->
    <path d="M390 0 L268 0 L252 88 L278 152 L246 232 L266 302 L232 374 L256 450 L224 522 L250 598 L216 670 L242 748 L208 844 L390 844 Z"
      fill="url(#k-wall)"/>
    <g stroke="#161b1e" stroke-width="1.3" fill="none" opacity=".5">
      <path d="M320 40 C 306 150, 336 250, 312 356 S 340 560, 310 760"/>
      <path d="M362 90 C 350 200, 372 300, 352 420 S 374 620, 348 800"/>
    </g>
    <!-- the three ledges the labels point at -->
    <g fill="#4e585e">
      <path d="M252 236 L214 244 L216 252 L254 250 Z"/>
      <path d="M232 378 L188 388 L190 397 L234 393 Z"/>
      <path d="M224 526 L196 533 L198 540 L226 537 Z"/>
    </g>
    <!-- leader lines from label to ledge -->
    <g stroke="#1b2226" stroke-width="1" opacity=".4">
      <path d="M150 246 L212 246" stroke-dasharray="2 3"/>
      <path d="M124 390 L186 390" stroke-dasharray="2 3"/>
      <path d="M136 534 L194 534" stroke-dasharray="2 3"/>
    </g>
  </svg>

  <div style="position:absolute;top:20px;left:18px">
    <div style="font-size:20px;font-weight:600;letter-spacing:.2px;color:#1b2226">The Fridge</div>
    <div style="font-size:9.5px;letter-spacing:2.2px;color:#6a7a83;margin-top:2px">V3 &middot; NORTH FACE</div>
  </div>
  <div style="position:absolute;top:22px;right:16px;text-align:right;color:#e7edef">
    <div style="font-size:8.5px;letter-spacing:1.8px;opacity:.72">HOLD</div>
    <div style="font-size:18px;font-weight:600;line-height:1.1">3<span style="opacity:.55;font-size:12px"> / 7</span></div>
  </div>

  <!-- pump reads as an altimeter tape, which is what a side view wants -->
  <div style="position:absolute;left:16px;top:120px;height:300px;width:52px">
    <div style="position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(27,34,38,.16);border-radius:3px"></div>
    <div style="position:absolute;left:0;bottom:0;width:5px;height:63.6%;border-radius:3px;
      background:linear-gradient(0deg,#9c3a1c,#d2803c)"></div>
    <div style="position:absolute;left:11px;bottom:calc(63.6% - 8px);font-size:14px;font-weight:700;color:#1b2226">7</div>
    <div style="position:absolute;left:11px;bottom:calc(63.6% - 22px);font-size:8px;letter-spacing:1.6px;color:#6a7a83">PUMP/11</div>
    <div style="position:absolute;left:11px;top:-2px;font-size:8px;letter-spacing:1.6px;color:#9c3a1c">PEEL</div>
  </div>
  <div style="position:absolute;left:16px;top:440px;font-size:8.5px;letter-spacing:1.8px;color:#2f7d52">FLOW 2</div>

  <div class="lbl" style="left:26px;top:224px;width:124px">
    <b>sloper</b><div class="s" style="color:#7a5bbd">GREASY</div>
    <div class="n">2 <i>BITE</i> &nbsp; 6 <i>GRIP</i></div>
  </div>
  <div class="lbl" style="left:0;top:368px;width:124px">
    <b>the blank</b><div class="s" style="color:#9c3a1c">COMMITTING</div>
    <div class="n">4 <i>BITE</i> &nbsp; 8 <i>GRIP</i></div>
  </div>
  <div class="lbl" style="left:12px;top:516px;width:124px">
    <b>smear edge</b>
    <div class="n">1 <i>BITE</i> &nbsp; 3 <i>GRIP</i></div>
  </div>

  <!-- the climber, in profile on the arete -->
  <svg viewBox="0 0 54 88" style="position:absolute;left:214px;top:404px;width:54px;height:88px" aria-hidden="true">
    <g fill="#11161a" opacity=".95">
      <circle cx="34" cy="12" r="7.5"/>
      <path d="M34 19 L27 50 L40 50 Z"/>
      <path d="M30 22 L14 4 L19 0 L36 20 Z"/>
      <path d="M38 24 L50 34 L47 39 L34 30 Z"/>
      <path d="M29 50 L20 82 L26 84 L35 56 Z"/><path d="M38 50 L44 74 L38 77 L32 56 Z"/>
    </g>
  </svg>

  <!-- the preview reads as a callout on the hold being played -->
  <div style="position:absolute;left:26px;top:274px;width:150px;background:rgba(47,125,82,.14);
    border-left:3px solid #2f7d52;padding:6px 9px;border-radius:0 3px 3px 0">
    <div style="font-size:11.5px;font-weight:700;color:#2f7d52;letter-spacing:.4px">WORKS IT</div>
    <div style="font-size:9.5px;color:#4a5b64;margin-top:2px">2 grip left &middot; +1 pump</div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:236px;
    background:linear-gradient(180deg,rgba(207,220,225,0),rgba(214,225,229,.94) 26%,#dbe4e7 46%)"></div>

  <div style="position:absolute;left:14px;right:14px;bottom:80px;display:flex;gap:9px;align-items:flex-end">
    <div class="card" style="flex:1;height:126px;transform:rotate(-3deg)">
      <div style="font-size:12.5px;font-weight:600;line-height:1.1;color:#1b2226">Open Hand</div>
      <div style="font-size:8.5px;color:#6a7a83;line-height:1.35;margin-top:5px">Friction &middot; ignores Greasy.</div>
      <div style="position:absolute;left:8px;bottom:7px;font-size:13px;font-weight:700;color:#9c3a1c">2</div>
      <div style="position:absolute;right:8px;bottom:7px;font-size:13px;font-weight:700;color:#2f7d52">7</div>
    </div>
    <div class="card" style="flex:1;height:142px;outline:2px solid #9c3a1c;outline-offset:-1px">
      <div style="font-size:12.5px;font-weight:600;line-height:1.1;color:#1b2226">Lock Off</div>
      <div style="font-size:8.5px;color:#6a7a83;line-height:1.35;margin-top:5px">Static &middot; takes 1 less Bite.</div>
      <div style="position:absolute;left:8px;bottom:7px;font-size:13px;font-weight:700;color:#9c3a1c">3</div>
      <div style="position:absolute;right:8px;bottom:7px;font-size:13px;font-weight:700;color:#2f7d52">6</div>
    </div>
    <div class="card" style="flex:1;height:126px;transform:rotate(3deg)">
      <div style="font-size:12.5px;font-weight:600;line-height:1.1;color:#1b2226">Smear</div>
      <div style="font-size:8.5px;color:#6a7a83;line-height:1.35;margin-top:5px">Support 1.</div>
      <div style="position:absolute;left:8px;bottom:7px;font-size:13px;font-weight:700;color:#9c3a1c">1</div>
      <div style="position:absolute;right:8px;bottom:7px;font-size:13px;font-weight:700;color:#2f7d52">6</div>
    </div>
  </div>

  <button style="position:absolute;left:16px;right:16px;bottom:20px;height:48px;border:0;border-radius:4px;
    background:#1b2226;color:#f4efe4;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:2.6px">COMMIT</button>
</div>
</x-dc>
</body>
</html>
