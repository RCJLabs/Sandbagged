<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;font-family:'Inter','Segoe UI',system-ui,sans-serif}
    .rg .spoke{position:absolute;width:112px;margin-left:-56px;text-align:center}
    .rg .spoke .h{font-size:12.5px;font-weight:600;color:#f2f4f6;letter-spacing:.1px}
    .rg .spoke .s{font-size:8px;letter-spacing:1.6px;margin-top:2px}
    .rg .spoke .n{margin-top:4px;font-size:11px;font-weight:700;display:flex;gap:10px;justify-content:center}
    .rg .dot{width:12px;height:12px;border-radius:50%;margin:0 auto 6px;border:2px solid #55606b;background:#1a1e23}
  </style>
</helmet>

<div class="rg" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 34%,#232a31 0%,#12161a 62%,#0b0e11 100%);color:#f2f4f6">

  <div style="position:absolute;top:20px;left:0;right:0;text-align:center">
    <div style="font-size:9px;letter-spacing:3px;color:#6d7a86">HOLD 3 OF 7</div>
    <div style="font-size:18px;font-weight:600;margin-top:3px">The Fridge <span style="color:#6d7a86;font-weight:400">V3</span></div>
  </div>

  <!-- the dial: pump is the arc, holds sit at compass points -->
  <div style="position:absolute;left:50%;top:300px;transform:translate(-50%,-50%);width:250px;height:250px">
    <svg viewBox="0 0 250 250" style="width:250px;height:250px">
      <circle cx="125" cy="125" r="104" fill="none" stroke="#232a31" stroke-width="14"/>
      <circle cx="125" cy="125" r="104" fill="none" stroke="#f0a03c" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="416 653" transform="rotate(-90 125 125)"/>
      <circle cx="125" cy="125" r="104" fill="none" stroke="#e0574a" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="0.1 653" stroke-dashoffset="-594" transform="rotate(-90 125 125)"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:56px;font-weight:200;line-height:1;letter-spacing:-2px">7</div>
      <div style="font-size:9px;letter-spacing:3px;color:#6d7a86;margin-top:4px">PUMP / 11</div>
      <div style="margin-top:12px;font-size:9.5px;letter-spacing:1.6px;color:#5fd1a0">FLOW 2</div>
    </div>
  </div>

  <div class="spoke" style="left:88px;top:154px">
    <div class="dot" style="border-color:#8a7cc8;background:#8a7cc8"></div>
    <div class="h">sloper</div><div class="s" style="color:#8a7cc8">GREASY</div>
    <div class="n"><span style="color:#e0574a">2</span><span style="color:#5fd1a0">6</span></div>
  </div>
  <div class="spoke" style="left:302px;top:154px">
    <div class="dot" style="border-color:#e0574a;background:#e0574a"></div>
    <div class="h">the blank</div><div class="s" style="color:#e0574a">COMMITTING</div>
    <div class="n"><span style="color:#e0574a">4</span><span style="color:#5fd1a0">8</span></div>
  </div>
  <div class="spoke" style="left:195px;top:452px">
    <div class="dot"></div>
    <div class="h">smear edge</div><div class="s" style="color:#6d7a86">CLEAN</div>
    <div class="n"><span style="color:#e0574a">1</span><span style="color:#5fd1a0">3</span></div>
  </div>

  <!-- the read-out for whatever the thumb is on -->
  <div style="position:absolute;left:24px;right:24px;top:556px;text-align:center">
    <div style="font-size:9px;letter-spacing:2.4px;color:#6d7a86">LOCK OFF &rarr; SLOPER</div>
    <div style="font-size:24px;font-weight:600;margin-top:6px;color:#5fd1a0">WORKS IT</div>
    <div style="font-size:11px;color:#9aa6b2;margin-top:4px">2 grip left &middot; +1 pump</div>
  </div>

  <!-- thumb arc: cards on a curve at the bottom of the screen -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:210px">
    <div style="position:absolute;left:50%;bottom:-118px;transform:translateX(-50%);width:520px;height:260px;
      border-radius:50%;background:#171b20;border-top:1px solid #262d34"></div>
    <div style="position:absolute;left:20px;bottom:66px;width:96px;transform:rotate(-14deg);text-align:center;
      background:#1f242a;border:1px solid #313a43;border-radius:14px;padding:10px 8px">
      <div style="font-size:11.5px;font-weight:600">Open Hand</div>
      <div style="font-size:8px;color:#8492a0;margin-top:3px;line-height:1.3">ignores Greasy</div>
      <div style="margin-top:6px;font-size:12px;font-weight:700"><span style="color:#e0574a">2</span>
        <span style="color:#3c454f">/</span> <span style="color:#5fd1a0">7</span></div>
    </div>
    <div style="position:absolute;left:50%;margin-left:-52px;bottom:92px;width:104px;text-align:center;
      background:#f0a03c;color:#141719;border-radius:16px;padding:12px 8px;box-shadow:0 0 0 4px rgba(240,160,60,.18)">
      <div style="font-size:12.5px;font-weight:700">Lock Off</div>
      <div style="font-size:8px;color:#6b4c1c;margin-top:3px;line-height:1.3">takes 1 less Bite</div>
      <div style="margin-top:6px;font-size:13px;font-weight:800">2 / 6</div>
    </div>
    <div style="position:absolute;right:20px;bottom:66px;width:96px;transform:rotate(14deg);text-align:center;
      background:#1f242a;border:1px solid #313a43;border-radius:14px;padding:10px 8px">
      <div style="font-size:11.5px;font-weight:600">Smear</div>
      <div style="font-size:8px;color:#8492a0;margin-top:3px;line-height:1.3">Support 1</div>
      <div style="margin-top:6px;font-size:12px;font-weight:700"><span style="color:#e0574a">1</span>
        <span style="color:#3c454f">/</span> <span style="color:#5fd1a0">6</span></div>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:8.5px;letter-spacing:2.4px;color:#5a6672">
      DRAG A CARD ONTO A HOLD
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
