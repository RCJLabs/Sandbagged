en on it yet. Work it once and it reads true for the rest of the trip.","That sloper is Greasy: you lose 1 Power on it unless your feet are on something. Put a card in the FEET lane — leaving it empty is campusing, and costs you Bite on both hands.","Every turn costs pump, plus one for each hold you have not answered. Clearing holds is how you outrun it. Max pump and you are off.","Watch the top of the screen. Every few turns the route does something — greases up, dries out, a gust — and it always says so a turn beforehand.","A card that survives a turn settles in, gaining Power for every turn it stays. Leaving a good card where it is usually beats moving it.","A gaston pulls sideways, and sideways needs something pulling back. On its own it is weak. Put the undercling in the other hand and both get stronger.","Sharp holds burn your card out for the rest of the burn when they blow it. Careful what you put on them.","That is a crux. It needs Power 2 or more or the move does nothing at all. Line something real up for it.","You are near the top, which the game calls EXPOSED. Backing off from here costs an extra psyche. Finishing does not.","Last one. Everything you have just learned is the whole game — the rest is more of it, harder, and further from the car."],Ce=n=>({type:"climb",routeIdx:n}),an={type:"camp",routeIdx:-1},Ea={type:"event",routeIdx:-1},fi=n=>({type:"project",routeIdx:n}),nn={type:"shop",routeIdx:-1},sd={type:"fa",routeIdx:-1},ir=n=>({type:"boss",routeIdx:n}),Mb=[[Ce(0),Ce(1)],[Ce(2),Ea,Ce(1)],[an,Ce(3),Ea],[Ce(3),Ce(4),fi(10),nn],[an,Ea,Ce(5),nn],[Ce(5),Ce(6)],[an,Ce(7),Ea,sd],[Ce(7),Ce(8),fi(34),nn],[ir(9)]],Cb=[[Ce(11),Ce(12),Ce(31)],[an,Ea,Ce(13),nn],[Ce(13),Ce(14),fi(18),nn],[an,Ce(15),Ea,sd],[Ce(15),Ce(16),Ce(30),nn],[Ce(30),Ce(32),Ea],[an,Ea,fi(35)],[ir(17)]],Ob=[[Ce(19),Ce(20)],[an,Ea,Ce(21)],[Ce(21),Ce(22),fi(28),nn],[Ce(23),Ce(24),nn],[an,Ce(25),Ea,sd],[Ce(25),Ce(26),nn],[an,Ea,fi(36)],[ir(27)],[ir(29)]],mt=[Mb,Cb,Ob],cl=["Act 1 · the forest","Act 2 · desert towers","Act 3 · the alpine wall"],Db=5,Na=[{id:1,title:"First entry",text:"Came up the drainage looking for the wall in the old survey photo. Found it. Nobody has been here. No chalk, no tick marks, no trail. I sat under it until dark and did not touch it."},{id:8,title:"The survey photo",text:"The photo is from 1961 and it is nine-tenths cloud. There is a line of shadow on the left edge that is either a corner system or a scratch on the negative. I have looked at it enough to know I am no longer looking at it, I am looking at what I have decided it is."},{id:2,title:"On the grade",text:"I have climbed harder. I have not climbed anything that made less sense. Every sequence I try is the wrong one, and the wrong one still gets me two moves higher than the last."},{id:9,title:"On the rock",text:"It is better rock than it has any right to be. Everything around it is rubbish — you could pull the whole ridge down with a nut key — and then this one fin of something hard and grey that nobody has touched. I do not know what it is doing there. Neither does the guidebook, because there is no guidebook."},{id:3,title:"Conditions",text:"It only comes into condition for about nine days a year, as far as I can tell. Cold, dry, north wind. The rest of the time it seeps and the crux is a waterfall."},{id:10,title:"The walk in",text:"Four hours if the creek is low. Six if it is not, and the last hour of it is moraine, which is four hours of its own kind. I have done it eleven times now and the walk has never once got shorter. What changed is that I stopped resenting it."},{id:4,title:"On going alone",text:"Told Marge I was working the Cathedral. Not a lie exactly. She would come if I asked and I am not asking. This one is mine to be stupid about."},{id:11,title:"On Marge",text:"She asked me straight out tonight and I told her the Cathedral again. She let me. That is the part I keep turning over — she let me, and she knew, and she let me anyway. I do not know what to do with being loved by somebody that patient."},{id:12,title:"On being frightened",text:"I am not brave. I want that written down somewhere by me and not by somebody else afterwards. I am frightened up there the whole time. What I am is willing to be frightened for nine hours, which is a different thing and a much smaller one."},{id:5,title:"The crux",text:"The move is a cross-through off a two-finger pocket to a sloper you cannot see from the ground. I have done it four times. I have never done it with anything left."},{id:13,title:"The traverse",text:"Everybody who ever looks at this will think the crux is the crux. It is not. It is the forty feet after it, where you are pumped stupid and the holds are fine and there is nothing to do but keep going sideways with the whole drainage under your heels."},{id:14,title:"The day it rained",text:"Sat under it for six hours watching water come down the line I want to climb. Ate everything I had. Walked out in the dark. That was the seventh attempt and I want to be honest that I cried on the moraine, and that it was not about the climb."},{id:6,title:"Last entry",text:"Conditions are perfect. Skin is good. If it goes I will name it for the drainage and not for me. If it does not go I will be back in the spring."},{id:15,title:"On the name",text:"If it goes I am not putting my name on it. I have thought about this the whole walk in and out, eleven times. A name is a way of telling people you were there, and the only thing I have ever wanted from this line is the part where nobody was."},{id:7,title:"At the top",text:"Nine days of weather and it went on the seventh. I have not told anybody and I do not think I am going to. Marge would want to know, and I would want to tell her, and both of those are reasons to keep it. A line nobody knows about stays the way it was when I found it. So I am going to call it nothing at all. Whoever comes up here next can do the naming."}],or=[{id:"storm",title:"Weather Coming In",text:"Anvil cloud over the ridge. Maybe an hour, maybe twenty minutes.",choices:[{label:"Get on it wet",outcome:{text:"You climb it damp and it goes, barely. Your skin pays.",skin:-2,xp:12}},{label:"Sit it out under the boulder",outcome:{text:"An hour under an overhang. You lose the day but keep the skin.",xp:4}}]},{id:"hold",title:"The Hold Goes",text:"A flake you have used twice shifts under your hand. It is going to break for somebody.",choices:[{label:"Trundle it now",outcome:{text:"It lands in the talus. Safer for everyone. The line got harder.",curse:"Cold Shut",xp:10}},{label:"Leave it and say nothing",outcome:{text:"You climb past it and do not sleep well.",xp:4}}]},{id:"access",title:"Access Notice",text:"New sign at the pullout. Landowner has had enough of the parking.",choices:[{label:"Walk in the long way",outcome:{text:"Two extra miles each way. Legs cooked, conscience clean — and the landowner waves at you on the third morning.",skin:-1,psyche:2,xp:16}},{label:"Park down the road and slip in",outcome:{text:"You get away with it. So does everyone, until nobody does.",xp:6,curse:"Sandbagged Beta"}}]},{id:"ethics",title:"Bolt War",text:"Two locals arguing about a bolt someone added to a highball. Both want you to agree.",choices:[{label:"Side with the first ascensionist",outcome:{text:"The old guard buys your coffee and tells you things.",cardRarity:"uncommon"}},{label:"Stay out of it and go climbing",outcome:{text:"You get three burns in while they shout.",xp:10}}]},{id:"rescue",title:"Somebody Is Hurt",text:"A shout from the next boulder over. Ankle, bad landing, nobody else around.",choices:[{label:"Carry them out",outcome:{text:"Four hours. Your day is done and your back is wrecked.",skin:-2,xp:20}},{label:"Point them at the trail",outcome:{text:"They manage. You climb. It sits with you.",xp:2}}]},{id:"van",title:"The Van",text:"Turns over and does not catch. Again.",choices:[{label:"Sell a rack piece to pay for it",outcome:{text:"Cash for the alternator. Something had to go.",removeCard:!0,xp:6}},{label:"Sleep at the trailhead and fix it Monday",outcome:{text:"Three nights of bad sleep. You climb anyway.",skin:-1,xp:10}}]},{id:"bear",title:"Bear Got The Bag",text:"Food bag shredded, forty feet from where you hung it. Amateur hour.",choices:[{label:"Ration what is left",outcome:{text:"Two days on trail mix and stubbornness.",skin:-2,xp:8}},{label:"Drive to town for supplies",outcome:{text:"A whole day gone to a grocery run. You do buy tape.",card:"Tape Job"}}]},{id:"oldtimer",title:"The Old Timer",text:"Someone who has been coming here for thirty years watches you fall off the same move twice.",choices:[{label:"Ask him how he did it",outcome:{text:"He draws the sequence in the dirt with a stick. You will not forget it.",boon:!0}},{label:"Ask for the beta",outcome:{text:"He shows you where the foot goes. It was never a hand problem.",card:"Drop Knee"}},{label:"Work it out yourself",outcome:{text:"Six more burns. You own it now.",skin:-1,xp:16}}]},{id:"restday",title:"Rest Day",text:"Skin is shot and you know it. There is also a forecast window closing.",choices:[{label:"Spend the day watching",outcome:{text:"A whole day of other people climbing, and something clicks.",boon:!0}},{label:"Actually rest",outcome:{text:"A whole day doing nothing. It is the hardest discipline there is.",skin:2}},{label:"Go touch rock anyway",outcome:{text:"You get away with it this time.",skin:-1,xp:14}}]},{id:"chalkbag",title:"Somebody Left A Bag",text:"A chalk bag under a boulder, rain-stiff, no name in it. Been there a season at least.",choices:[{label:"Read what is written inside",outcome:{text:"Somebody wrote their beta on the lining in biro.",boon:!0}},{label:"Take it",outcome:{text:"Good brush inside. Somebody else brushed these holds first.",card:"Brush"}},{label:"Hang it where they will find it",outcome:{text:"It is gone next week. Somebody found it.",xp:8}}]},{id:"sandbag",title:"A Friendly Grade",text:"Guy at the parking lot says the line at the far end is a soft V2. Great warm-up, he says.",choices:[{label:"Believe him",outcome:{text:"It is not a V2. It was never a V2.",curse:"Sandbagged Beta",xp:14}},{label:"Go look at it yourself first",outcome:{text:"You walk up, look at it, and walk away. Good instincts.",xp:6}}]},{id:"cairn",title:"A Cairn Where There Should Not Be One",text:"Six stones stacked on a boulder well off the trail. Old lichen on the top one.",choices:[{label:"Look underneath",outcome:{text:"A page in a ziplock, gone soft with damp.",journal:0,xp:10}},{label:"Leave it be",outcome:{text:"Somebody meant that. You keep walking.",xp:4}}]},{id:"campsite",title:"The Old Campsite",text:"Fire ring grown over, a bent pot, and a stuff sack wedged under a rock.",choices:[{label:"Go through it",outcome:{text:"Notebook pages, a wire brush, and a name you half recognise.",journal:0,card:"Guidebook"}},{label:"Make camp and leave it alone",outcome:{text:"You sleep well in somebody else's good spot.",skin:1,xp:4}}]},{id:"seep",title:"Seepage",text:"The whole lower band is weeping. Half the crag is off.",choices:[{label:"Hike higher to the dry stuff",outcome:{text:"Steep approach, cold wind, perfect friction up top.",skin:-1,xp:16}},{label:"Take the day off",outcome:{text:"You read in the van and let the skin come back.",skin:1,xp:4}}]},{id:"board",title:"The Hangboard In The Van",text:"It is right there. It is always right there.",choices:[{label:"Do it his way",outcome:{text:"It is not how you were taught. It is better.",boon:!0}},{label:"Do a session",outcome:{text:"Hard to say if it helped. Easy to say it cost skin.",skin:-1,xp:12}},{label:"Leave it alone, you are on a trip",outcome:{text:"You go look at boulders instead. Correct.",xp:6}}]},{id:"choss",title:"A Line Nobody Has Done",text:"Obvious prow, obvious holds, no chalk anywhere. There is usually a reason.",choices:[{label:"Try it",outcome:{text:"Two good moves and a lot of gravel. You learn something.",skin:-1,cardRarity:"common",xp:12}}, n town",outcome:{text:"Twenty dollars and a shirt that does not fit, and you walk in and out of that base all week without thinking about it.",cash:-20,psyche:1,xp:14}}]},{id:"water",act:1,title:"The Cache Is Gone",text:"Six litres buried under a cairn last week. Cairn is there. Water is not.",choices:[{label:"Ration and keep climbing",outcome:{text:"A dry, hot, stupid day. You get up something.",skin:-2,xp:16}},{label:"Drive out for more",outcome:{text:"Ninety minutes each way and a tank of fuel.",cash:-25}}]},{id:"heat",act:1,title:"Midday",text:"A hundred and six on the rock. Nothing will stick until five.",choices:[{label:"Sleep under the van until it turns",outcome:{text:"You wake at four to perfect conditions.",psyche:1,xp:8}},{label:"Try it hot",outcome:{text:"Greasy, furious, pointless. You learn the moves at least.",skin:-1,xp:14}}]},{id:"flood",act:1,title:"Water In The Wash",text:"Thunderheads on the mesa, and you are camped in a dry riverbed.",choices:[{label:"Move camp now, in the dark",outcome:{text:"Two hours of it. By morning the wash is a river and you are watching it from high ground, dry, with the kettle on.",psyche:2,xp:12}},{label:"It will not come to anything",outcome:{text:"It comes to something. You save most of the gear and lose the rest downstream.",cash:-30,skin:-1,xp:10}}]},{id:"snake",act:1,title:"Under The Boulder",text:"Something moves in the shade where you were about to drop the pads.",choices:[{label:"Move the session elsewhere",outcome:{text:"You climb somewhere worse and live.",psyche:1}},{label:"Pad the other side and get on",outcome:{text:"You spend every rest checking over your shoulder.",xp:12,skin:-1}}]},{id:"towerdrive",act:1,title:"Forty Miles Of Washboard",text:"The tower you want is at the end of a road that is barely one.",choices:[{label:"Drive it",outcome:{text:"Something under the van is looser than it was.",cash:-20,xp:14}},{label:"Walk in from the highway",outcome:{text:"Nine miles with pads. You arrive destroyed.", e scar is pale and obvious from the trail, and there is a party under it looking up at it, and one of them is saying it must have come off in the winter.",choices:[{label:"Say nothing.",outcome:{text:"You let them have the winter. It is not even a lie, exactly.",xp:12}},{label:"Tell them it was you.",outcome:{text:'The oldest one nods. "Better on the ground than on somebody." He means it, and it helps more than you expected.',psyche:1,xp:22}}]},{id:"ethics2",title:"Word Got Round",after:"ethics:0",text:"Somebody you have never met knows what you said at the campsite about the bolt, and repeats it back to you slightly wrong, as though it were a thing you are known for.",choices:[{label:"Let it stand.",outcome:{text:"It is close enough, and arguing would make it a bigger thing than it was.",xp:14}},{label:"Correct it, carefully.",outcome:{text:"You get it back to what you actually said. It takes ten minutes and they respect you more for the ten minutes than for the opinion.",psyche:1,xp:18}}]},{id:"sandbag2",title:"Him Again",after:"sandbag:0",text:"The same man, at the same table, with the same certainty, about a different line. He does not remember telling you the last one was V2.",choices:[{label:"Ask him about the last one.",outcome:{text:'"That thing? That is nails." Not a flicker. He has simply moved the number and taken the memory with it.',xp:16}},{label:"Take the beta anyway.",outcome:{text:"You know exactly what you are getting and you take it anyway, which is at least an informed decision.",card:"Beta · The Grade",curse:"Sandbagged Beta",xp:12}}]},{id:"moraine",act:2,title:"Something In The Moraine",text:"A stuff sack, bleached almost white, wedged between two blocks.",choices:[{label:"Work it free",outcome:{text:"Rope, a rack of nuts, and a folded page.",journal:0,card:"Wired Nut"}},{label:"Leave it where it is",outcome:{text:"Whoever put it there had reasons.",psyche:1,xp:6}}]}];function Bb(n,s=0,c=[],u=[]){const f=or.filter(k=>k.act===void 0||k.act===s), 3",who:"Marge",act:1,after:"marge2",text:"I looked for two seasons. Walked every drainage on the north side with a photocopy of a survey photo. You know what I found? Good bouldering. That is all.",replies:[{label:"You stopped.",text:'"I stopped. That is allowed." She feeds the fire.',outcome:{skin:1}},{label:"I could bring something back.",text:'"Bring yourself back. Start there."',outcome:{skin:2}},{label:"You do not stop. You come down and go back up.",text:'She looks at your frostbitten kit and goes very still. "That is exactly what he used to say. It was not a compliment then either."',arch:"alpine"}]},{id:"marge4",who:"Marge",act:1,after:"marge3",needsPage:4,text:"That is his hand. I would know it upside down in the rain. Where.",replies:[{label:"Under a cairn, well off the trail.",text:'She reads it four times. Then she gives it back. "Keep it. It is beta now, not a letter."',outcome:{journal:0}}]},{id:"marge5",who:"Marge",act:2,after:"marge4",text:"North side of the third drainage, above the moraine. There is a wall you cannot see from the valley and he never once drew it in the margin, which is how I know.",replies:[{label:"Come with me.",text:'"No." A long pause. "Take the cams. He would want them up there and not in my shed."',outcome:{cardRarity:"rare"}},{label:"Thank you.",text:'"Do not thank me. Come back down."',outcome:{journal:0}}]},{id:"marge6",who:"Marge",act:0,after:"marge5",needsPage:7,text:"You have got that look. The one he used to come back with.",replies:[{label:"I found it. He did it first.",text:'"Of course he did." She is quiet for a long time. "Thirty years I have been angry at a man for dying on something he had already climbed." She laughs, once, and it is not really a laugh.'},{label:"Say nothing.",text:"She looks at you, and then at the fire, and does not ask again. Some of it she works out anyway.",outcome:{journal:0}}]},{id:"marge7",who:"Marge",act:0,after:"marge6",text:"One thing. Did he name it?",replies:[{label:"He left that to whoever came next.",text:'"Then it is yours." She hands you the coffee. "Do not put your own name on it either. He would think that was hilarious and he would be right."',outcome:{psyche:2}}]},{id:"dale1",who:"Dale",act:0,text:"Everybody wants the ghost story. Nobody wants to hear he was a bit of a show-off who left his rubbish at the crag.",replies:[{label:"Was he strong?",text:'"Strongest I ever saw. That is the boring part of it."'},{label:"Did you like him?",text:'Long pause. "I did, actually. That is the annoying part of it."',outcome:{journal:0}},{label:"Gym strong, or rock strong?",text:'"Ha." He studies your downturned shoes. "Both, and he would have hated that you asked. A gym rat who could actually climb. Like someone else I am looking at."',arch:"comp"}]},{id:"dale2",who:"Dale",act:1,after:"dale1",text:"He used to say a grade is just a rumour that got organised. Drove the guidebook people mad.",replies:[{label:"He was not wrong.",text:'"He was not wrong. He was insufferable about it."',outcome:{xp:8}},{label:"Sounds like an excuse.",text:'"It was. He was also the only one who could back it up."',outcome:{journal:0}},{label:"A grade is a conversation, not a number.",text:'He looks at your rack of tat and old cams. "Now you sound like him. That is not a warning, exactly. But watch yourself."',arch:"trad"},{label:"You only really know a grade first try.",text:'"He said that too." Dale almost winces. "Right before he sandbagged half the valley. Careful whose habits you pick up."',arch:"onsight"}]},{id:"dale3",who:"Dale",act:2,after:"dale2",text:"If you find it and it is not as hard as he said, you keep that to yourself. Let him have the one thing.",replies:[{label:"And if it is harder?",text:'"Then you tell everyone. Loudly. He would have."',outcome:{cardRarity:"uncommon",journal:0}}]},{id:"nita1",who:"Nita",act:0,text:"Honest question. Do you actually believe there is a wall up there, or is this a nice long walk with a story attached?",replies:[{label:"I believe the survey photo.",text:'"A photo of a shadow." She shrugs. "Fine. It is a nice walk."'},{label:"It is a nice long walk.",text:'She laughs, properly. "Okay. Now I like you."',outcome:{xp:6}},{label:"The walk is the point. So is the rack.",text:'She eyes the nuts and slings hanging off you. "Oh, you are one of the old ones. He would have talked your ear off at this fire and enjoyed every minute."',arch:"trad"}]},{id:"nita2",who:"Nita",act:1,after:"nita1",text:"I climb harder than he did. On plastic. I know exactly what that sentence is worth, before you say it.",replies:[{label:"It is worth something.",text:'"It is worth something on plastic." She is quiet a moment. "Show me the pages."',outcome:{cardRarity:"uncommon"}},{label:"Say it out loud again.",text:"She does. It sounds smaller the second time and she knows it.",outcome:{journal:0}},{label:"I climb harder than him too. On plastic.",text:'She looks at you properly for the first time. "Then we already understand each other." A pause. "It still does not count up here. But show me the pages."',arch:"comp"},{label:"I would not know. I do not rehearse.",text:'"An onsighter." She shakes her head. "On his rock, first try? That is not confidence, that is a comedy. Good luck."',arch:"onsight"}]},{id:"nita3",who:"Nita",act:2,after:"nita2",text:"I found this wedged in a crack on the approach. I nearly used it for kindling before I read it.",replies:[{label:"Let me see.",text:"A page, water-stained, in the same hand as the rest.",outcome:{journal:0}}]},{id:"ellis1",who:"Ranger Ellis",act:1,text:"Whatever you are doing up the third drainage, do it before the fifteenth. After that the road closes and I am not coming to get you.",replies:[{label:"Understood.",text:"He writes your plate down anyway. Fair enough."},{label:"What is up the third drainage?",text:'"Rock. Weather. A lot of both." He is already walking away.',outcome:{xp:6}},{label:"The weather up there does not read your calendar.",text:'Ellis stops. Looks at your rimed-up rack. "No. But I do, and the road still closes on the fifteenth. People like you are exactly who I write down."',arch:"alpine"}]},{id:"ellis2",who:"Ranger Ellis",act:2,after:"ellis1",text:"We pulled a pack out of the moraine field in ninety-eight. No name in it. It is in a box in the office if you want to look at it.",replies:[{label:"I want to look at it.",text:"Rope, a rack, and a notebook with the last four pages torn out.",outcome:{journal:0,xp:10}},{label:"Leave it in the box.",text:'"That is probably the right answer." He does not sound sure.',outcome:{skin:1}}]},{id:"pim1",who:"Pim",act:0,text:"Mate, your van is nicer than my van and my van has a bed in it. That is a serious accusation and I stand by it.",replies:[{label:"It has a bed in it.",text:'"Then we are the same. Have some coffee."',outcome:{skin:1}},{label:"It is not a nice van.",text:'"No. It is not." He seems relieved.',outcome:{cardRarity:"common"}}]},{id:"pim2",who:"Pim",act:1,after:"pim1",text:"Everyone out here is looking for something. Mine is a shower. Yours seems harder to find.",replies:[{label:"Yours sounds better.",text:'"Mine is achievable. That is the whole trick."',outcome:{skin:1,xp:6}}]},{id:"pim3",who:"Pim",act:2,after:"pim2",text:"This is where I turn round. I have been very clear with myself about what I am and am not doing, and that wall is in the second category.",replies:[{label:"Sensible.",text:'"It is. It is also the most boring thing about me." He leaves you the rest of his coffee and most of his tape.',outcome:{skin:2,cash:20,xp:10}},{label:"You could come as far as the moraine.",text:'He thinks about it longer than you expected. "No. But ask me again next year." He means it, which is worse.',outcome:{psyche:1,xp:14}}]},{id:"nita4",who:"Nita",act:2,after:"nita3",text:"I have been up on that face twice. Both times I came down and could not tell anybody why I had. It is not the difficulty. It is that it does not want anybody on it.",replies:[{label:"And you think I should go anyway.",text:'"I think you are going anyway. I am telling you what it is like so it does not surprise you."',outcome:{psyche:1,xp:12}},{label:"That sounds like superstition.",text:'She does not argue. "Come and find me after." Then, quieter: "Please come and find me after."',outcome:{xp:16}}]},{id:"marge8",who:"Marge",act:2,after:"marge5",text:"You have got the look he had the last week. I am not going to talk you out of it. I would like it on the record that I did not try.",replies:[{label:"It is on the record.",text:'"Good." She puts something in your hand — a stub of chalk gone hard with age. "That was in his van. Do what you like with it."',outcome:{psyche:1,xp:18}},{label:"Would you have talked him out of it?",text:'"No." A long pause. "I have had twenty-two years to decide whether that was love or laziness. I still do not know."',outcome:{xp:20}}]}],Xb=(n,s)=>n.replies.filter(c=>!c.arch||s.inRun&&va(s).id===c.arch);function Zb(n){if(!n.seen.includes("marge1"))return null;const s=n.established.find(c=>!n.seen.includes("fa:"+c.name));return s?og(s,n.act):null}function og(n,s){const c=n.claimed-n.real,u="fa:"+n.name;return c<=-2?{id:u,who:"Marge",act:s,text:`"${n.name}." She says it like she is trying it out. "Somebody came down off that saying it was V${n.claimed}. It is not V${n.claimed}." A pause. "He used to do that too."`,replies:[{label:"It felt like V"+n.claimed+".",outcome:{psyche:-1},text:'"It did not." She lets it sit. "You do not have to be hard about it. Nobody is keeping score but you."'},{label:"I got it wrong.",outcome:{psyche:1},text:'"You got it wrong on the low side, which is the only honest way to get it wrong." She refills your cup.'}]}:c>=2?{id:u,who:"Marge",act:s,text:`"${n.name}, V${n.claimed}." She does not look up. "Two people have been on it since. They both came down laughing." She pokes the fire. "It will get downgraded. They always do."`,replies:[{label:"It was hard for me.",outcome:{psyche:1},text:'"Then say that. That  font-size:calc(13.5px * var(--fs));font-weight:700;letter-spacing:.5px;line-height:1.1}
.tile .tsub{font-size:calc(10.5px * var(--fs));color:var(--fade);line-height:1.4;margin-top:4px}
.tile .tarrow{margin-left:auto;font-weight:700;opacity:.75}
.tile.hero{background:var(--ink);color:var(--paper);padding:14px 14px 15px}
.tile.hero .tname{font-size:calc(16.5px * var(--fs))}
.tile.hero .tsub{color:rgba(232,225,208,.8)}
.tile:disabled{opacity:.55}
.tile.quiet{padding:9px 12px}
.tile.quiet .tname{font-size:calc(12px * var(--fs))}
.tilerow{display:flex;gap:7px}
.tilerow .tile{flex:1;min-width:0}
.tilerow .tname{letter-spacing:.3px}
/* UI-2: the title card. A game should say its own name before it asks you to
   read a menu — and the tap that gets you past it is also the gesture browsers
   require before any audio can play, so the sound bed starts honestly here. */
.splash{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
 width:100%;min-height:88dvh;border:0;background:transparent;font-family:inherit;color:var(--ink);
 text-align:center;padding:0}
.splash .stitle{font-size:calc(34px * var(--fs));font-weight:700;letter-spacing:1px;line-height:1}
.splash .stag{font-size:calc(11.5px * var(--fs));color:var(--fade);margin-top:9px;letter-spacing:.3px}
.splash .sbegin{font-size:calc(12px * var(--fs));font-weight:700;letter-spacing:2.2px;
 margin-top:26px;animation:breathe 2.4s ease-in-out infinite}
.splash .sfoot{font-size:calc(10px * var(--fs));color:var(--fade);margin-top:8px}
@keyframes breathe{0%,100%{opacity:.42}50%{opacity:1}}
.big{font-size:calc(15px * var(--fs));font-weight:700}.center{text-align:center}
.famname{display:flex;align-items:center;gap:6px;min-width:0}
.deckrow{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid rgba(122,114,100,.28)}
.deckrow .nmx{flex:1;min-width:0}
.deckrow .t1{font-size:calc(12px * var(--fs));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deckrow .t2{font-size:calc(9px * var(--fs));color:var(--fade);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step{width:32px;height:32px;border:1.5px solid var(--ink);border-radius:2px;background:var(--paper);
 font-family:inherit;font-size:calc(16px * var(--fs));font-weight:700;line-height:1;color:var(--ink);flex:0 0 auto}
.step:disabled{opacity:.25}
.cnt{width:20px;text-align:center;font-size:calc(13px * var(--fs));font-weight:700;flex:0 0 auto}

.wrap{--fs:1}
.fs1{--fs:1.15}.fs2{--fs:1.3}
/* A11Y-2: motion off, by preference or by choice */
@media (prefers-reduced-motion: reduce){
 .wrap *{animation:none !important;transition:none !important}}
.nomo *{animation:none !important;transition:none !important}
/* A11Y-5: one-handed reach. The climb's controls drop to a thumb-reachable
   sticky bar at the bottom of the screen; left/right mirrors COMMIT onto the
   working thumb and gives it a bigger target. Layout only. */
.reach .climb-foot{position:sticky;bottom:6px;z-index:5;margin-top:8px;
 padding:7px 9px 8px;border-radius:12px;background:var(--paper);
 border:1.5px solid var(--ink);box-shadow:0 -3px 14px rgba(0,0,0,.22)}
.reach-l .commit-bar{flex-direction:row-reverse}
.reach-l .kit-bar{flex-direction:row-reverse}
.reach .commit-bar .btn.go{padding:14px 18px;font-size:calc(15px * var(--fs))}
