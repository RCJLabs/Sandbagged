<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#221d18" />
    <title>Sandbagged</title>
  </head>
  <body>
    <!-- ART-5: the chalk filter, defined ONCE for the whole document. Every frame on
         the climb screen references it by id, so there is one feTurbulence generator in
         the page rather than one per hold — App.tsx renders a fresh wrapper per phase,
         so a React-side <defs> would have had to be repeated on each of them. Static
         markup here is present for every screen and costs nothing to re-render. -->
    <svg width="0" height="0" aria-hidden="true" focusable="false"
         style="position:absolute;pointer-events:none">
      <filter id="chalkline" x="-12%" y="-12%" width="124%" height="124%"
              filterUnits="objectBoundingBox">
        <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.9"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
